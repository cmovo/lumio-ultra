<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" fill="none">
  <!-- striding character carrying an oversized photo strip -->
  <!-- photo strip -->
  <g transform="rotate(14 150 150)">
    <rect x="118" y="20" width="74" height="248" rx="10" fill="#F7F4E9" stroke="rgba(33,30,26,0.16)" stroke-width="2"/>
    <rect x="128" y="34" width="54" height="48" rx="4" fill="#272134"/>
    <rect x="128" y="92" width="54" height="48" rx="4" fill="#A98BE3"/>
    <rect x="128" y="150" width="54" height="48" rx="4" fill="#F25B2A"/>
    <rect x="128" y="208" width="54" height="48" rx="4" fill="#F2B63C"/>
    <!-- tiny faces in frames -->
    <circle cx="146" cy="56" r="8" fill="#E8A87C"/><circle cx="166" cy="60" r="8" fill="#8A5A3B"/>
    <circle cx="155" cy="116" r="9" fill="#E8A87C"/>
    <circle cx="148" cy="174" r="8" fill="#8A5A3B"/><circle cx="168" cy="172" r="7" fill="#E8A87C"/>
    <circle cx="155" cy="232" r="9" fill="#E8A87C"/>
  </g>
  <!-- back leg striding -->
  <path d="M76 234l-30 64c-3 7 0 13 7 13h10l34-70z" fill="#272134"/>
  <!-- front leg -->
  <path d="M112 240l16 60c2 8-1 14-8 14h-12l-20-70z" fill="#3A3450"/>
  <!-- shoes -->
  <path d="M42 304h30v12c0 5-4 8-9 8H36c-6 0-8-6-3-10z" fill="#F2B63C"/>
  <path d="M104 308h30v12c0 5-4 8-9 8H98c-6 0-8-6-3-10z" fill="#F2B63C"/>
  <!-- torso leaning -->
  <path d="M74 142c4-14 18-22 32-19s23 16 20 30l-14 84c-2 10-15 14-32 10s-27-12-25-22z" fill="#F25B2A"/>
  <!-- back arm wrapping strip -->
  <path d="M104 150l52 28-8 17-54-26c-9-5-1-24 10-19z" fill="#E8A87C"/>
  <circle cx="152" cy="186" r="12" fill="#E8A87C"/>
  <!-- head -->
  <circle cx="92" cy="98" r="28" fill="#E8A87C"/>
  <!-- hair: short curls -->
  <path d="M66 92c-6-22 12-38 28-37 16 1 30 12 28 32 0 0-7-11-14-12 1 5-4 9-4 9s-3-8-9-10c-9-3-22 4-29 18z" fill="#6F4FB8"/>
  <circle cx="64" cy="84" r="8" fill="#6F4FB8"/>
  <circle cx="118" cy="80" r="7" fill="#6F4FB8"/>
  <!-- face -->
  <circle cx="102" cy="100" r="3" fill="#211E1A"/>
  <path d="M106 112c-3 3-8 3-11 1" stroke="#211E1A" stroke-width="3" stroke-linecap="round"/>
  <!-- motion lines -->
  <g stroke="rgba(33,30,26,0.25)" stroke-width="4" stroke-linecap="round">
    <path d="M28 180h-20"/>
    <path d="M36 200h-28"/>
  </g>
</svg>
