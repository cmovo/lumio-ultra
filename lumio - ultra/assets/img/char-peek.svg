<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" fill="none">
  <!-- peeking character: head + hands over an edge -->
  <!-- hair back blob -->
  <path d="M58 96c-6-44 28-72 54-72s58 24 52 70c-2 16-10 22-10 22l-86 2s-8-6-10-22z" fill="#F25B2A"/>
  <!-- face -->
  <circle cx="110" cy="84" r="40" fill="#E8A87C"/>
  <!-- hair front fringe -->
  <path d="M70 78c-2-30 18-48 40-48s44 16 41 46c0 0-8-20-18-24-2 8-8 12-8 12s-2-12-10-16c-12-6-36 6-45 30z" fill="#F25B2A"/>
  <!-- hair bun -->
  <circle cx="110" cy="22" r="14" fill="#F25B2A"/>
  <!-- glasses -->
  <circle cx="94" cy="86" r="14" stroke="#F0BBD8" stroke-width="5" fill="rgba(255,255,255,0.35)"/>
  <circle cx="128" cy="86" r="14" stroke="#F0BBD8" stroke-width="5" fill="rgba(255,255,255,0.35)"/>
  <path d="M108 86h6" stroke="#F0BBD8" stroke-width="5" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="94" cy="87" r="3.4" fill="#211E1A"/>
  <circle cx="128" cy="87" r="3.4" fill="#211E1A"/>
  <!-- smile -->
  <path d="M104 106c4 3 10 3 14 0" stroke="#211E1A" stroke-width="3" stroke-linecap="round"/>
  <!-- hands gripping the edge -->
  <rect x="48" y="128" width="34" height="22" rx="11" fill="#E8A87C"/>
  <rect x="138" y="128" width="34" height="22" rx="11" fill="#E8A87C"/>
  <path d="M52 132h26M142 132h26" stroke="rgba(33,30,26,0.18)" stroke-width="3" stroke-linecap="round"/>
  <!-- sparkle -->
  <path d="M186 38l3.4 9.2 9.2 3.4-9.2 3.4-3.4 9.2-3.4-9.2-9.2-3.4 9.2-3.4z" fill="#F2B63C"/>
</svg>
